    <div class="catalogue" id="catalogue">
      <section class="category" aria-labelledby="cat-ms-title">
        <h2 class="category-title" id="cat-ms-title">質譜</h2>
        <div class="instrument-grid">
          <article class="instrument-card mint" aria-labelledby="ms-lcq-title">
            <a href="./lcq/" aria-labelledby="ms-lcq-title">
              <img src="./assets/lcq.svg" alt="離子阱質譜儀結構示意" width="440" height="260">
              <div class="card-label"><h3 id="ms-lcq-title">離子阱質譜</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card lavender" aria-labelledby="ms-mass-analyzers-title">
            <a href="./mass-analyzers/" aria-labelledby="ms-mass-analyzers-title">
              <img src="./assets/mass-analyzers.svg" alt="質譜儀的四種分析器:四極柱、離子阱、飛行時間與 Orbitrap 的概念示意" width="440" height="260">
              <div class="card-label"><h3 id="ms-mass-analyzers-title">質譜儀-不同分析器比較</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card blue" aria-labelledby="ms-gc-ms-title">
            <a href="./gc-ms/" aria-labelledby="ms-gc-ms-title">
              <img src="./assets/gc-ms.svg" alt="氣相層析儀連接質譜儀的結構示意" width="440" height="260">
              <div class="card-label"><h3 id="ms-gc-ms-title">GC-MS</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
        </div>
      </section>
      <section class="category" aria-labelledby="cat-chrom-title">
        <h2 class="category-title" id="cat-chrom-title">層析</h2>
        <div class="instrument-grid">
          <article class="instrument-card mint" aria-labelledby="chrom-chromatography-title">
            <a href="./chromatography/" aria-labelledby="chrom-chromatography-title">
              <img src="./assets/chromatography.svg" alt="玻璃管柱裡分開的色素帶,與一支一支出來的層析圖峰" width="440" height="260">
              <div class="card-label"><h3 id="chrom-chromatography-title">層析-GC 與 HPLC</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card blue" aria-labelledby="chrom-gc-ms-title">
            <a href="./gc-ms/" aria-labelledby="chrom-gc-ms-title">
              <img src="./assets/gc-ms.svg" alt="氣相層析儀連接質譜儀的結構示意" width="440" height="260">
              <div class="card-label"><h3 id="chrom-gc-ms-title">GC-MS</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
        </div>
      </section>
      <section class="category" aria-labelledby="cat-spec-title">
        <h2 class="category-title" id="cat-spec-title">光譜</h2>
        <div class="instrument-grid">
          <article class="instrument-card lavender" aria-labelledby="spec-spectroscopy-title">
            <a href="./spectroscopy/" aria-labelledby="spec-spectroscopy-title">
              <img src="./assets/spectroscopy.svg" alt="分子、能量階梯與從無線電波到 X 光的電磁波色帶" width="440" height="260">
              <div class="card-label"><h3 id="spec-spectroscopy-title">光譜-光與分子</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card lavender" aria-labelledby="spec-uv-vis-title">
            <a href="./uv-vis/" aria-labelledby="spec-uv-vis-title">
              <img src="./assets/uv-vis.svg" alt="光源、光柵與樣品槽的光路概念示意" width="440" height="260">
              <div class="card-label"><h3 id="spec-uv-vis-title">UV-Vis 分光光度計</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
        </div>
      </section>
      <section class="category" aria-labelledby="cat-nmr-title">
        <h2 class="category-title" id="cat-nmr-title">NMR</h2>
        <div class="instrument-grid">
          <article class="instrument-card blue" aria-labelledby="nmr-nmr-title">
            <a href="./nmr/" aria-labelledby="nmr-nmr-title">
              <img src="./assets/nmr.svg" alt="剖開的超導磁鐵、線圈中的自旋與一張氫譜的概念示意" width="440" height="260">
              <div class="card-label"><h3 id="nmr-nmr-title">NMR 核磁共振</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
        </div>
      </section>
      <section class="category" aria-labelledby="cat-bio-title">
        <h2 class="category-title" id="cat-bio-title">生化原理</h2>
        <div class="instrument-grid">
          <article class="instrument-card mint" aria-labelledby="bio-central-dogma-title">
            <a href="./central-dogma/" aria-labelledby="bio-central-dogma-title">
              <img src="./assets/central-dogma.svg" alt="DNA 雙股螺旋轉錄成 mRNA,核糖體沿著 mRNA 接出一串胺基酸" width="440" height="260">
              <div class="card-label"><h3 id="bio-central-dogma-title">中心法則</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card blue" aria-labelledby="bio-pcr-title">
            <a href="./pcr/" aria-labelledby="bio-pcr-title">
              <img src="./assets/pcr.svg" alt="分開的雙股 DNA 黏上引子,數量一輪一輪加倍,旁邊是跑出條帶的洋菜膠" width="440" height="260">
              <div class="card-label"><h3 id="bio-pcr-title">PCR 與電泳</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card lavender" aria-labelledby="bio-sequencing-title">
            <a href="./sequencing/" aria-labelledby="bio-sequencing-title">
              <img src="./assets/sequencing.svg" alt="一股 DNA 的鹼基對到四色峰圖的峰,旁邊是流動槽上一叢一叢發出四種顏色的 DNA" width="440" height="260">
              <div class="card-label"><h3 id="bio-sequencing-title">DNA 定序</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card mint" aria-labelledby="bio-dna-markers-title">
            <a href="./dna-markers/" aria-labelledby="bio-dna-markers-title">
              <img src="./assets/dna-markers.svg" alt="一段木頭的切面與一片葉子,旁邊是 DNA 的重複序列與電泳圖上的兩個峰" width="440" height="260">
              <div class="card-label"><h3 id="bio-dna-markers-title">DNA 鑑定與分子標記</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card blue" aria-labelledby="bio-cloning-title">
            <a href="./cloning/" aria-labelledby="bio-cloning-title">
              <img src="./assets/cloning.svg" alt="從葉片取得的基因片段帶著黏性末端,接進大腸桿菌裡的環狀質體,細菌做出一團團帶 His 標籤的酵素" width="440" height="260">
              <div class="card-label"><h3 id="bio-cloning-title">基因選殖與蛋白表現</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card lavender" aria-labelledby="bio-terpene-synthase-title">
            <a href="./terpene-synthase/" aria-labelledby="bio-terpene-synthase-title">
              <img src="./assets/terpene-synthase.svg" alt="臺灣杉的小枝旁,一條碳鏈鑽進萜類合成酶的口袋,口袋裡接成雙環的 pinene,右下是層析圖上的一支峰" width="440" height="260">
              <div class="card-label"><h3 id="bio-terpene-synthase-title">萜類合成酶</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card mint" aria-labelledby="bio-crispr-title">
            <a href="./crispr/" aria-labelledby="bio-crispr-title">
              <img src="./assets/crispr.svg" alt="Cas9 蛋白套在雙股 DNA 上,嚮導 RNA 和其中一股配對,旁邊框起來的是 PAM,兩股在同一個位置被剪開" width="440" height="260">
              <div class="card-label"><h3 id="bio-crispr-title">CRISPR 基因編輯</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card blue" aria-labelledby="bio-immunoassay-title">
            <a href="./immunoassay/" aria-labelledby="bio-immunoassay-title">
              <img src="./assets/immunoassay.svg" alt="兩支 Y 字形的抗體夾住目標蛋白,左邊是有發光條帶的膜,右邊是顏色深淺不同的孔盤" width="440" height="260">
              <div class="card-label"><h3 id="bio-immunoassay-title">抗體檢測:西方墨點法與 ELISA</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card lavender" aria-labelledby="bio-flow-cytometry-title">
            <a href="./flow-cytometry/" aria-labelledby="bio-flow-cytometry-title">
              <img src="./assets/flow-cytometry.svg" alt="細胞在細細的液流裡排成一列通過雷射,散射出的光變成點圖上的兩群點,其中一群被圈起來" width="440" height="260">
              <div class="card-label"><h3 id="bio-flow-cytometry-title">流式細胞儀</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
          <article class="instrument-card mint" aria-labelledby="bio-proteomics-title">
            <a href="./proteomics/" aria-labelledby="bio-proteomics-title">
              <img src="./assets/proteomics.svg" alt="一條胺基酸串成的胜肽斷成兩段,旁邊的碎片質譜上,兩根相鄰峰之間的距離對應一個胺基酸" width="440" height="260">
              <div class="card-label"><h3 id="bio-proteomics-title">蛋白質質譜定序</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
        </div>
      </section>
      <section class="category" aria-labelledby="cat-tools-title">

        <div class="instrument-grid">
          <article class="instrument-card mint" aria-labelledby="tools-plot-title">
            <a href="./plot/" aria-labelledby="tools-plot-title">
              <img src="./assets/plot.svg" alt="一個檔案落進畫框,框裡畫出一條黑白的光譜曲線" width="440" height="260">
              <div class="card-label"><h3 id="tools-plot-title">數據畫圖</h3><span aria-hidden="true">↗</span></div>
            </a>
          </article>
        </div>
      </section>
    </div>
