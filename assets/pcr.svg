<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" fill="none" role="img" aria-label="分開的雙股 DNA 黏上引子,數量一輪一輪加倍,旁邊是跑出條帶的洋菜膠">
  <ellipse cx="220" cy="238" rx="190" ry="11" fill="#050e0c" opacity=".45"/>
  <!-- 左:分開的雙股與引子 -->
  <g stroke-linecap="round">
    <path d="M34 70H170" stroke="#d5ddd9" stroke-width="4"/>
    <path d="M34 150H170" stroke="#d5ddd9" stroke-width="4"/>
    <g stroke-width="7">
      <path d="M42 74v13" stroke="#5fd39a"/><path d="M58 74v13" stroke="#f2a65a"/><path d="M74 74v13" stroke="#f0718a"/><path d="M90 74v13" stroke="#6fb2f5"/><path d="M106 74v13" stroke="#f0718a"/><path d="M122 74v13" stroke="#f2a65a"/><path d="M138 74v13" stroke="#5fd39a"/><path d="M154 74v13" stroke="#6fb2f5"/>
      <path d="M42 146v-13" stroke="#f2a65a"/><path d="M58 146v-13" stroke="#5fd39a"/><path d="M74 146v-13" stroke="#6fb2f5"/><path d="M90 146v-13" stroke="#f0718a"/><path d="M106 146v-13" stroke="#6fb2f5"/><path d="M122 146v-13" stroke="#5fd39a"/><path d="M138 146v-13" stroke="#f2a65a"/><path d="M154 146v-13" stroke="#f0718a"/>
    </g>
    <!-- 引子(琥珀)與新股(薄荷綠) -->
    <path d="M38 116H96" stroke="#ffd166" stroke-width="4"/>
    <g stroke-width="7"><path d="M42 119v9" stroke="#5fd39a"/><path d="M58 119v9" stroke="#f2a65a"/><path d="M74 119v9" stroke="#f0718a"/><path d="M90 119v9" stroke="#6fb2f5"/></g>
    <path d="M100 116H132" stroke="#a5f3cd" stroke-width="4"/>
    <ellipse cx="146" cy="110" rx="17" ry="12" fill="#b8a4f4" opacity=".9"/>
    <path d="M118 98H154" stroke="#a5f3cd" stroke-width="2" stroke-dasharray="2 5"/>
  </g>
  <!-- 中:一輪一輪加倍 -->
  <g stroke-linecap="round">
    <path d="M190 112h22" stroke="#a5f3cd" stroke-width="2.4"/><path d="M207 106l7 6-7 6" stroke="#a5f3cd" stroke-width="2.4" stroke-linejoin="round"/>
    <g stroke-width="3.4">
      <path d="M226 110h16M226 116h16" stroke="#d5ddd9"/>
      <path d="M254 98h16M254 104h16" stroke="#d5ddd9"/><path d="M254 122h16M254 128h16" stroke="#a5f3cd"/>
      <path d="M284 86h14M284 91h14M284 102h14M284 107h14" stroke="#a5f3cd"/><path d="M284 118h14M284 123h14M284 134h14M284 139h14" stroke="#a5f3cd" opacity=".75"/>
    </g>
    <text x="226" y="162" fill="#9caca5" font-size="11" font-family="Consolas,monospace">1 → 2 → 4</text>
  </g>
  <!-- 右:洋菜膠 -->
  <rect x="318" y="40" width="96" height="176" rx="6" fill="#97c4cf" fill-opacity=".12" stroke="#7fa6b0" stroke-opacity=".6"/>
  <g fill="#05090a"><rect x="330" y="52" width="26" height="5" rx="1.5"/><rect x="376" y="52" width="26" height="5" rx="1.5"/></g>
  <g fill="#ffd98a">
    <rect x="331" y="76" width="24" height="4" rx="2" opacity=".75"/><rect x="331" y="94" width="24" height="4" rx="2" opacity=".75"/><rect x="331" y="116" width="24" height="4" rx="2" opacity=".75"/><rect x="331" y="142" width="24" height="4" rx="2" opacity=".75"/><rect x="331" y="172" width="24" height="4" rx="2" opacity=".75"/>
    <rect x="377" y="128" width="24" height="5" rx="2.5"/>
  </g>
  <rect x="373" y="122" width="32" height="17" rx="8.5" stroke="#a5f3cd" stroke-width="1.4"/>
  <path d="M366 228h0" stroke="#ff7b7b" stroke-width="2"/>
  <text x="352" y="232" fill="#ff7b7b" font-size="11" font-family="Consolas,monospace">+</text>
  <text x="352" y="34" fill="#9caca5" font-size="11" font-family="Consolas,monospace">−</text>
</svg>
