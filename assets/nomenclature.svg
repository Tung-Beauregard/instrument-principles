  <circle cx="330" cy="126" r="11" fill="#0f1716" stroke="#8fa39b" stroke-width="1.5"/>
  <g font-family="Segoe UI,Noto Sans TC,sans-serif" font-weight="700" text-anchor="middle">
    <text x="330" y="131" fill="#d5ddd9" font-size="12">C</text>
