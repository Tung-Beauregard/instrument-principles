  <circle cx="191" cy="104" r="3.4" fill="#8ec5ff"/>
  <text x="59" y="99" fill="#ffd166" font-family="Segoe UI,Noto Sans TC,sans-serif" font-weight="700" font-size="16" text-anchor="middle">O</text>
  <g font-family="Consolas,monospace" font-weight="800" font-size="11" text-anchor="middle" fill="#0b1111">
    <circle cx="26" cy="181" r="8" fill="#a5f3cd"/><text x="26" y="185">1</text>
    <circle cx="59" cy="162" r="8" fill="#a5f3cd"/><text x="59" y="166">2</text>
    <circle cx="92" cy="181" r="8" fill="#a5f3cd"/><text x="92" y="185">3</text>
    <circle cx="125" cy="120" r="8" fill="#a5f3cd"/><text x="125" y="124">4</text>
    <circle cx="158" cy="181" r="8" fill="#a5f3cd"/><text x="158" y="185">5</text>
    <circle cx="191" cy="162" r="8" fill="#a5f3cd"/><text x="191" y="166">6</text>
    <circle cx="224" cy="181" r="8" fill="#a5f3cd"/><text x="224" y="185">7</text>
