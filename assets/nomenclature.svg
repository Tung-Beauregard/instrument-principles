<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" fill="none" role="img" aria-label="左邊是編好號的碳鏈,有一個雙鍵、一個 C=O 和一個甲基;右邊是立體中心,四個原子團標上名次 1 到 4,箭頭順時針繞一圈是 R">
