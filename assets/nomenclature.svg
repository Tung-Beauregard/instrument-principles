    <path d="M125 141L158 160L191 141L224 160" stroke="#c3cdc8"/>
    <path d="M90.6 157.3L123.6 138.3M93.4 162.7L126.4 143.7" stroke="#ff9a5c" stroke-width="2.3"/>
