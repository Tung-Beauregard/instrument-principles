  <path d="M283 147L284 163L298 156Z" fill="#a5f3cd"/>
  <g stroke-linecap="round">
    <path d="M330 126V84" stroke="#c3cdc8" stroke-width="2.6"/>
    <path d="M330 126L380 150L376 158Z" fill="#c3cdc8"/>
