<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" fill="none" role="img" aria-label="一條胺基酸串成的胜肽斷成兩段,旁邊的碎片質譜上,兩根相鄰峰之間的距離對應一個胺基酸">
  <ellipse cx="220" cy="236" rx="186" ry="12" fill="#050e17" opacity=".4"/>
  <!-- 胜肽:左段(b,藍)與右段(y,薄荷綠),中間的肽鍵斷開 -->
  <path d="M40 172C58 160 76 148 98 140C116 134 128 131 140 130" stroke="#7fa3c4" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M190 128C204 129 216 133 228 140" stroke="#7cc9a6" stroke-width="3.4" stroke-linecap="round"/>
  <g stroke-width="2.6">
    <circle cx="40" cy="172" r="15" fill="#14251e" stroke="#a4c9ef"/>
    <circle cx="72" cy="153" r="15" fill="#14251e" stroke="#a4c9ef"/>
    <circle cx="105" cy="139" r="15" fill="#14251e" stroke="#a4c9ef"/>
    <circle cx="139" cy="131" r="15" fill="#14251e" stroke="#a4c9ef"/>
    <circle cx="192" cy="128" r="15" fill="#14251e" stroke="#a5f3cd"/>
    <circle cx="226" cy="139" r="15" fill="#14251e" stroke="#a5f3cd"/>
  </g>
  <g fill="#a4c9ef" opacity=".85"><circle cx="40" cy="172" r="3.6"/><circle cx="72" cy="153" r="3.6"/><circle cx="105" cy="139" r="3.6"/><circle cx="139" cy="131" r="3.6"/></g>
  <g fill="#a5f3cd" opacity=".85"><circle cx="192" cy="128" r="3.6"/><circle cx="226" cy="139" r="3.6"/></g>
  <!-- 斷開處的火花 -->
  <path d="M168 104L161 120H171L163 138" stroke="#ffd166" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M152 104L157 111M184 104L179 111M166 148V155" stroke="#ffd166" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
  <!-- 撞上的氣體分子 -->
  <g fill="#8fa39b" opacity=".6"><circle cx="98" cy="98" r="4"/><circle cx="62" cy="114" r="3"/><circle cx="196" cy="174" r="4"/></g>
  <path d="M106 102L130 116" stroke="#8fa39b" stroke-width="1.6" stroke-dasharray="2 4" opacity=".7"/>
  <!-- 碎片的質譜 -->
  <rect x="252" y="40" width="170" height="174" rx="10" fill="#0f1d18" stroke="#2b3b33" stroke-width="2"/>
  <path d="M266 196H410" stroke="#5b7a8c" stroke-width="1.8"/>
  <g stroke="#a4c9ef" stroke-width="3" stroke-linecap="round"><path d="M280 196V156M313 196V130M350 196V144M392 196V158"/></g>
  <g stroke="#a5f3cd" stroke-width="3" stroke-linecap="round"><path d="M294 196V118M330 196V88M370 196V102M404 196V132"/></g>
  <!-- 相鄰兩根峰之間的距離 = 一個胺基酸 -->
  <path d="M330 72H370M330 65V79M370 65V79" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
  <text x="350" y="61" fill="#ffd166" font-size="13" font-weight="700" font-family="Consolas,monospace" text-anchor="middle">L</text>
  <path d="M206 168C220 178 232 182 244 182" stroke="#a5f3cd" stroke-opacity=".7" stroke-dasharray="3 4"/>
  <path d="M238 177L245 182L238 187" stroke="#a5f3cd" stroke-opacity=".7"/>
  <text x="40" y="34" fill="#9eb9ca" font-size="9" font-family="Consolas,monospace" letter-spacing="1">READ THE GAPS</text>
  <path d="M386 226H413M39 63H51M45 57V69M30 206H62" stroke="#526e80"/>
</svg>
