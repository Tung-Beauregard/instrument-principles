<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" fill="none" role="img" aria-label="Cas9 蛋白套在雙股 DNA 上,嚮導 RNA 和其中一股配對,旁邊框起來的是 PAM,兩股在同一個位置被剪開">
  <ellipse cx="220" cy="236" rx="190" ry="11" fill="#050e0c" opacity=".45"/>
  <!-- Cas9:半透明的一大塊,包住嚮導與 PAM -->
  <ellipse cx="208" cy="132" rx="114" ry="78" fill="#b8a4f4" fill-opacity=".14" stroke="#b8a4f4" stroke-opacity=".75" stroke-width="2"/>
  <g stroke-linecap="round">
    <!-- 上面那一股:中間被擠開往上拱,在 PAM 往回 3 個的地方剪斷 -->
    <path d="M22 120H114C130 120 132 82 150 82H193" stroke="#d5ddd9" stroke-width="4"/>
    <path d="M203 82H222C240 82 242 120 258 120H418" stroke="#d5ddd9" stroke-width="4"/>
    <!-- 下面那一股:和嚮導配對,也在同一個位置剪斷 -->
    <path d="M22 172H193M203 172H418" stroke="#d5ddd9" stroke-width="4"/>
    <!-- 嚮導 RNA(琥珀色) -->
    <path d="M118 134H244" stroke="#ffd166" stroke-width="4"/>
    <g stroke-width="7">
      <!-- 上面那一股的鹼基:A G C T A G … PAM(A G G)… T C A G T C A -->
      <path d="M30 124v12" stroke="#5fd39a"/><path d="M46 124v12" stroke="#f0718a"/><path d="M62 124v12" stroke="#6fb2f5"/><path d="M78 124v12" stroke="#f2a65a"/><path d="M94 124v12" stroke="#5fd39a"/><path d="M110 124v12" stroke="#f0718a"/>
      <path d="M254 124v12" stroke="#5fd39a"/><path d="M270 124v12" stroke="#f0718a"/><path d="M286 124v12" stroke="#f0718a"/>
      <path d="M302 124v12" stroke="#f2a65a"/><path d="M318 124v12" stroke="#6fb2f5"/><path d="M334 124v12" stroke="#5fd39a"/><path d="M350 124v12" stroke="#f0718a"/><path d="M366 124v12" stroke="#f2a65a"/><path d="M382 124v12" stroke="#6fb2f5"/><path d="M398 124v12" stroke="#5fd39a"/>
      <!-- 被擠開的那一段(和嚮導一樣的序列) -->
      <path d="M158 86v12" stroke="#6fb2f5"/><path d="M174 86v12" stroke="#5fd39a"/><path d="M190 86v12" stroke="#f2a65a"/><path d="M206 86v12" stroke="#f0718a"/>
      <!-- 嚮導 RNA 的鹼基:U G C A U G A C -->
      <path d="M126 138v11" stroke="#e8cf5a"/><path d="M142 138v11" stroke="#f0718a"/><path d="M158 138v11" stroke="#6fb2f5"/><path d="M174 138v11" stroke="#5fd39a"/><path d="M190 138v11" stroke="#e8cf5a"/><path d="M206 138v11" stroke="#f0718a"/><path d="M222 138v11" stroke="#5fd39a"/><path d="M238 138v11" stroke="#6fb2f5"/>
      <!-- 下面那一股的鹼基(和上面配對) -->
      <path d="M30 168v-12" stroke="#f2a65a"/><path d="M46 168v-12" stroke="#6fb2f5"/><path d="M62 168v-12" stroke="#f0718a"/><path d="M78 168v-12" stroke="#5fd39a"/><path d="M94 168v-12" stroke="#f2a65a"/><path d="M110 168v-12" stroke="#6fb2f5"/>
      <path d="M126 168v-12" stroke="#5fd39a"/><path d="M142 168v-12" stroke="#6fb2f5"/><path d="M158 168v-12" stroke="#f0718a"/><path d="M174 168v-12" stroke="#f2a65a"/><path d="M190 168v-12" stroke="#5fd39a"/><path d="M206 168v-12" stroke="#6fb2f5"/><path d="M222 168v-12" stroke="#f2a65a"/><path d="M238 168v-12" stroke="#f0718a"/>
      <path d="M254 168v-12" stroke="#f2a65a"/><path d="M270 168v-12" stroke="#6fb2f5"/><path d="M286 168v-12" stroke="#6fb2f5"/>
      <path d="M302 168v-12" stroke="#5fd39a"/><path d="M318 168v-12" stroke="#f0718a"/><path d="M334 168v-12" stroke="#f2a65a"/><path d="M350 168v-12" stroke="#6fb2f5"/><path d="M366 168v-12" stroke="#5fd39a"/><path d="M382 168v-12" stroke="#f0718a"/><path d="M398 168v-12" stroke="#f2a65a"/>
    </g>
    <!-- PAM 的框 -->
    <rect x="245" y="115" width="50" height="27" rx="5" stroke="#a5f3cd" stroke-width="2"/>
    <!-- 切點的火花 -->
    <g stroke="#a5f3cd" stroke-width="2.2">
      <path d="M198 66v-8M188 70l-5-5M208 70l5-5"/>
      <path d="M198 188v8M188 184l-5 5M208 184l5 5"/>
    </g>
  </g>
  <text x="252" y="38" fill="#9caca5" font-size="11" font-family="Consolas,monospace" letter-spacing="1">FIND · CUT · REPAIR</text>
</svg>
