    <path d="M266 182C282 150 298 150 312 176C326 202 342 204 356 178C370 152 386 150 400 174" stroke="#4f8f74" stroke-width="2.6"/>
    <g fill="#16302a" stroke="#4f8f74" stroke-width="1.6" opacity=".8"><path d="M300 200l6-8h12l6 8-6 8h-12z"/><path d="M344 200l6-8h12l6 8-6 8h-12z"/></g>
    <g fill="#2c6a52" stroke="#a5f3cd" stroke-width="1.8"><path d="M258 182l6-8h12l6 8-6 8h-12z"/><path d="M280 156l6-8h12l6 8-6 8h-12z"/><path d="M324 176l6-8h12l6 8-6 8h-12z"/><path d="M366 158l6-8h12l6 8-6 8h-12z"/><path d="M392 174l6-8h12l6 8-6 8h-12z"/></g>
